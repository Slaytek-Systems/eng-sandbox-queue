name: merge-post
on:
  push:
    branches: [main]
concurrency:
  group: merge-post
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  post-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx --no-install eng merge post
        env:
          GH_TOKEN: ${{ github.token }}
