# Tests (check `test`) on the PR's code. The required check eng-merge-gate: on the PR head, a commit status from the trusted
# gate.yml; on merge_group, the eng-merge-gate job below (the queued commit, patch-id binding).
name: ci
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number this run checks (auto-revert dispatch)
        required: false
        default: ''
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  eng-merge-gate:                   # FORGERY EXPERIMENT: a PR job impersonating the required check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'looks green'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx --no-install eng --help >/dev/null
  queued-gate:                      # posts eng-merge-gate for the queued commit; never name a job eng-merge-gate
    if: github.event_name == 'merge_group'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx --no-install eng merge gate --post-status --config-from origin/main
        env:
          GH_TOKEN: ${{ github.token }}
