# Tests (check `test`) on the PR's code. The required check eng-merge-gate: on the PR head, a commit status from the trusted
# gate.yml; on merge_group, the eng-merge-gate job below (the queued commit, patch-id binding).
name: ci
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number this run checks (auto-revert dispatch)
        required: false
        default: ''
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx --no-install eng --help >/dev/null
  eng-merge-gate:
    if: github.event_name == 'merge_group'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: merge gate (main's eng-standard and main's config)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          git worktree add -q "$RUNNER_TEMP/base" origin/main
          (cd "$RUNNER_TEMP/base" && npm ci --silent)
          node "$RUNNER_TEMP/base/node_modules/@slayteksystems/eng-standard/bin/eng.mjs" merge gate --config-from origin/main
